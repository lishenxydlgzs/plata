[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontology"
version = "0.1.0"
description = "A lightweight entity-graph modeling library with typed entities, relationships, actions, semantic search, and a data pipeline framework."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
vector = ["lancedb>=0.10.0", "pyarrow"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
ontology = "ontology.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
